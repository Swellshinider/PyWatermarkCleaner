[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywatermarkcleaner"
version = "1.0.0"
description = "Cross-platform video watermark cleaning for desktop and command-line use"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Swellshinider" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.115,<1",
  "imageio-ffmpeg>=0.5,<1",
  "numpy>=2.4,<3",
  "opencv-python>=5,<6",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
pywatermarkcleaner = "pywatermarkcleaner.cli:main"

[project.gui-scripts]
pywatermarkcleaner-gui = "pywatermarkcleaner.web:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pywatermarkcleaner = ["assets/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pywatermarkcleaner"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
