name: Portable release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            artifact: PyWatermarkCleaner-1.0.0-windows-x64
          - runner: ubuntu-24.04
            artifact: PyWatermarkCleaner-1.0.0-linux-x64
          - runner: macos-15
            artifact: PyWatermarkCleaner-1.0.0-macos-arm64
          - runner: macos-15-intel
            artifact: PyWatermarkCleaner-1.0.0-macos-intel
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install build dependencies
        run: uv sync --locked --extra dev
      - name: Test before packaging
        run: uv run --locked pytest
      - name: Build portable folder
        run: uv run --locked pyinstaller --noconfirm --clean packaging/PyWatermarkCleaner.spec
      - name: Smoke Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dist\PyWatermarkCleaner\PyWatermarkCleanerCLI.exe --version
          dist\PyWatermarkCleaner\PyWatermarkCleaner.exe --smoke-test
      - name: Smoke Unix launchers
        if: runner.os != 'Windows'
        run: |
          dist/PyWatermarkCleaner/PyWatermarkCleanerCLI --version
          dist/PyWatermarkCleaner/PyWatermarkCleaner --smoke-test
      - name: Archive Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\PyWatermarkCleaner -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Archive Unix folder
        if: runner.os != 'Windows'
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" PyWatermarkCleaner
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
